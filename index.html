<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171d29">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="烏の棲む空">
<title>烏の棲む空 — Living Sky</title>
<style>
:root{
  color-scheme:dark;
  --page:#0d111a; --panel:#171d29; --panel-soft:#202735;
  --ink:#e8edf4; --muted:#929daf; --line:#465164; --accent:#cbd4e1;
  --sky-top:#596b7c; --sky-mid:#3a4a5a; --sky-low:#202b38;
  --wind-a:-.5deg; --wind-b:1deg; --tree-speed:6.8s; --cloud-speed:72s;
  --rain-angle:105deg; --rain-speed:.55s;
}
*{box-sizing:border-box}
html{min-height:100%;background:var(--page);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100svh;background:var(--page);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;display:flex;justify-content:center}
button{font:inherit;-webkit-tap-highlight-color:transparent}
.app{width:min(760px,100%);min-height:100vh;min-height:100svh;margin:0 auto;background:var(--panel);overflow:hidden;box-shadow:0 18px 70px #0005}
/* ── Living landscape ── */
.scene{height:clamp(280px,42svh,420px);min-height:280px;position:relative;overflow:hidden;isolation:isolate;background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 58%,var(--sky-low) 100%);transition:background 3s ease;--wind-turn:1deg}
.scene:after{content:"";position:absolute;inset:0;z-index:12;pointer-events:none;background:linear-gradient(180deg,rgba(7,13,22,.28),transparent 28%,transparent 61%,rgba(8,13,21,.64))}
.scene.weather-rain{--sky-top:#465565;--sky-mid:#303e4d;--sky-low:#1b2632}
.scene.weather-fog{--sky-top:#68717d;--sky-mid:#46515e;--sky-low:#293440}
.scene.weather-clearing{--sky-top:#758494;--sky-mid:#4c5e6e;--sky-low:#283542}
.scene.late-night-clock,.scene.deep-session{--sky-top:#39495b;--sky-mid:#283747;--sky-low:#141e2b}
.header{position:absolute;z-index:8;left:clamp(18px,5vw,34px);top:clamp(17px,4vh,28px);pointer-events:none}
.brand{font-size:clamp(16px,4.4vw,20px);font-weight:700;letter-spacing:.23em;text-shadow:0 1px 10px #10192355}
.subtitle{margin-top:8px;font-size:10px;letter-spacing:.27em;color:#e1e7edb8}
.weather-label{margin-top:8px;font-size:10px;letter-spacing:.14em;color:#e0e6edaa}
.moon{position:absolute;z-index:1;right:13%;top:18%;width:clamp(54px,14vw,82px);aspect-ratio:1;border-radius:50%;background:rgba(211,218,218,.58);box-shadow:0 0 30px rgba(222,229,232,.16),0 0 72px rgba(222,229,232,.08);transition:opacity 3s,transform 3s}
.scene.weather-rain .moon{opacity:.38;transform:scale(.96)}
.scene.weather-fog .moon{opacity:.25;filter:blur(2px)}
.scene.weather-clearing .moon{opacity:.75;box-shadow:0 0 42px rgba(231,237,239,.28),0 0 90px rgba(231,237,239,.12)}
.cloud{position:absolute;z-index:1;left:-220px;width:clamp(145px,42vw,260px);height:52px;border-radius:60px;background:rgba(194,207,217,.16);filter:blur(7px);animation:cloud-drift var(--cloud-speed) linear infinite;will-change:transform}
.cloud:before,.cloud:after{content:"";position:absolute;bottom:8px;border-radius:50%;background:inherit}
.cloud:before{width:43%;height:68px;left:17%;top:-28px}.cloud:after{width:53%;height:76px;left:48%;top:-21px}
.cloud.one{top:31%;animation-delay:-19s}.cloud.two{top:45%;width:clamp(180px,51vw,330px);opacity:.65;animation-duration:calc(var(--cloud-speed) * 1.3);animation-delay:-51s}
@keyframes cloud-drift{from{transform:translateX(-10vw)}to{transform:translateX(145vw)}}
.haze{position:absolute;z-index:2;inset:25% -35% 17%;opacity:0;pointer-events:none;filter:blur(18px);background:linear-gradient(90deg,transparent,rgba(209,218,224,.18),rgba(209,218,224,.1),transparent);transform:translateX(-15%);transition:opacity 3s}
.weather-fog .haze{opacity:.9;animation:fog-drift 28s ease-in-out infinite alternate}
@keyframes fog-drift{to{transform:translateX(26%)}}
.light-shaft{position:absolute;z-index:2;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 74% 28%,rgba(224,230,226,.24),transparent 38%);transition:opacity 4s}
.weather-clearing .light-shaft{opacity:1}
/* Wind lines and trees */
.wind-line{position:absolute;z-index:3;left:-35%;width:170%;height:24px;border-top:1px solid rgba(224,233,239,.13);border-radius:50%;opacity:.28;pointer-events:none;animation:wind-sweep 11s ease-in-out infinite alternate}
.wind-line.a{top:37%;transform:rotate(-3deg)}.wind-line.b{top:47%;opacity:.16;animation-delay:-4s;animation-duration:15s}
@keyframes wind-sweep{from{translate:-2% 0;opacity:.12}to{translate:3% -5px;opacity:.42}}
.tree{position:absolute;z-index:3;bottom:7%;width:clamp(76px,23vw,138px);height:58%;transform-origin:50% 100%;animation:tree-sway var(--tree-speed) ease-in-out infinite alternate;will-change:transform}
.tree.left{left:1.5%;--branch-delay:0s}.tree.right{right:1%;height:47%;width:clamp(65px,18vw,112px);animation-duration:calc(var(--tree-speed) * 1.19);animation-delay:-2.7s}
@keyframes tree-sway{from{transform:rotate(var(--wind-a))}to{transform:rotate(var(--wind-b))}}
.tree svg{width:100%;height:100%;overflow:visible}
.tree .trunk{stroke:#172330;stroke-width:6;fill:none;stroke-linecap:round}
.tree .bough{stroke:#192633;stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:50% 100%;animation:branch-sway 5.2s ease-in-out infinite alternate}
.tree .twig{stroke:#1c2a37;stroke-width:3.2;fill:none;stroke-linecap:round;opacity:.95;transform-box:fill-box;transform-origin:50% 100%;animation:branch-sway 4.1s ease-in-out infinite alternate-reverse}
.tree.right .bough{animation-duration:6.3s}.tree.right .twig{animation-duration:5.4s}
@keyframes branch-sway{from{transform:rotate(-.45deg)}to{transform:rotate(.7deg)}}
/* distant town */
.city{position:absolute;z-index:3;bottom:6.5%;left:0;right:0;height:25%;display:flex;align-items:flex-end;gap:2.8%;opacity:.78;pointer-events:none}
.building{position:relative;flex:1;min-width:0;height:var(--h);background:#1b2835;box-shadow:inset 0 8px 0 rgba(139,154,168,.045)}
.building:before{content:"";position:absolute;inset:10% 18%;background:repeating-linear-gradient(0deg,transparent 0 12px,rgba(183,197,207,.13) 13px 15px);opacity:var(--lit,.55)}
.building:nth-child(3n):before{opacity:.16}.building:nth-child(4n+1):before{animation:window-breathe 9s ease-in-out infinite alternate}.building:nth-child(7n):before{animation:window-breathe 12s ease-in-out infinite alternate-reverse}@keyframes window-breathe{from{opacity:.10;filter:blur(0)}to{opacity:.27;filter:blur(.35px)}}.building:nth-child(4n):after{content:"";position:absolute;top:-12px;left:42%;height:12px;width:2px;background:#1b2835}
.ground{position:absolute;z-index:4;bottom:0;left:0;right:0;height:8%;background:linear-gradient(180deg,rgba(50,62,75,.82),#1b2531);box-shadow:0 -8px 26px rgba(207,219,226,.08)}
/* electric wire and insulators */
.wire-wrap{position:absolute;z-index:5;left:0;right:0;top:57%;height:27px;pointer-events:none;animation:wire-breathe 8s ease-in-out infinite alternate;rotate:var(--wire-lean,0deg);transform-origin:50% 50%}
.wire{position:absolute;left:-2%;right:-2%;top:7px;height:2px;border-radius:50%;background:#111d29;box-shadow:0 1px 0 rgba(205,214,222,.28),0 0 3px rgba(0,0,0,.35);transform:rotate(-.15deg)}
.wire:before,.wire:after{content:"";position:absolute;top:-1px;width:2px;height:92px;background:rgba(18,28,39,.72)}.wire:before{left:5%}.wire:after{right:6%}
@keyframes wire-breathe{from{translate:0 -.3px}to{translate:0 .8px}}
/* Crow SVG stage */
#crowField{position:absolute;z-index:7;inset:0;pointer-events:none}
.crow{position:absolute;width:clamp(76px,22vw,96px);height:64px;transform:translateX(-50%);transform-origin:50% 70%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));will-change:transform,left,top}
.crow svg{display:block;width:100%;height:100%;overflow:visible}
.crow .body{fill:#0b121c}.crow .body-shadow{fill:#182536}.crow .wing-far{fill:#0a111a}.crow .wing-near{fill:#121e2b}.crow .wing-feather{fill:#273547}.crow .tail{fill:#0d1723}.crow .beak{fill:#111a25}.crow .eye{fill:#dce4e9}.crow .eye-glint{fill:#fff;opacity:.85}
.crow .legs{fill:none;stroke:#0e1721;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}.crow .claws{fill:none;stroke:#0d1721;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.crow .head-group{transform-box:view-box;transform-origin:91px 31px}.crow .wing-near{transform-box:view-box;transform-origin:53px 43px}.crow .wing-far{transform-box:view-box;transform-origin:49px 41px}
.crow .puff{fill:none;stroke:rgba(36,52,69,.95);stroke-width:3;stroke-linecap:round;stroke-dasharray:3 3;opacity:0}
.crow .wing-near{transition:filter .3s}.crow.idle{animation:crow-idle 6.5s ease-in-out infinite}.crow.idle:nth-child(even){animation-delay:-2.4s}
@keyframes crow-idle{0%,100%{translate:0 0}50%{translate:0 -1px}}
.crow.action-tilt .head-group{animation:head-tilt 1.15s ease-in-out 1}
@keyframes head-tilt{0%,100%{transform:rotate(0)}38%,70%{transform:rotate(17deg)}}
.crow.action-preen .head-group{animation:head-preen 1.55s ease-in-out 1}
.crow.action-preen .wing-near{animation:preen-wing 1.55s ease-in-out 1}
@keyframes head-preen{0%,100%{transform:rotate(0)}35%,68%{transform:rotate(32deg) translate(-2px,5px)}}
@keyframes preen-wing{0%,100%{transform:rotate(0)}42%{transform:rotate(-13deg)}70%{transform:rotate(7deg)}}
.crow.action-stretch .wing-near{animation:wing-stretch 1.8s ease-in-out 1}
@keyframes wing-stretch{0%,100%{transform:rotate(0)}42%,70%{transform:rotate(-44deg) translate(-1px,-4px)}}
.crow.action-flap .wing-near,.crow.action-flap .wing-far{animation:wing-flap .32s ease-in-out 3 alternate}
@keyframes wing-flap{from{transform:rotate(-8deg)}to{transform:rotate(-52deg)}}
.crow.action-hop{animation:crow-hop .72s cubic-bezier(.2,.7,.3,1) 1}
@keyframes crow-hop{0%,100%{translate:0 0}35%{translate:8px -12px}65%{translate:13px 0}}
.crow.action-rain .crow-svg{animation:rain-shiver .88s ease-in-out 2}
.crow.action-rain .puff{opacity:.95;animation:puff-in .95s ease-in-out 2}
.crow.action-rain .head-group{animation:rain-head .88s ease-in-out 2}
@keyframes rain-shiver{0%,100%{transform:translate(0,0) rotate(0)}18%{transform:translate(-2px,1px) rotate(-4deg)}38%{transform:translate(2px,0) rotate(4deg)}58%{transform:translate(-1px,0) rotate(-2deg)}78%{transform:translate(1px,0) rotate(2deg)}}
@keyframes puff-in{0%,100%{opacity:0;transform:scale(.96)}30%,70%{opacity:.95;transform:scale(1.02)}}
@keyframes rain-head{0%,100%{transform:rotate(0)}48%{transform:rotate(-12deg)}}
.crow.action-puff .puff{opacity:.8;animation:puff-in 1.1s ease-in-out 1}
.crow.action-puff .crow-svg{animation:small-fluff .75s ease-in-out 1}
@keyframes small-fluff{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.crow.action-land .crow-svg{animation:land-bob .72s ease-out 1}
@keyframes land-bob{0%{transform:translateY(-8px) scale(1.04)}45%{transform:translateY(2px) scale(.97)}72%{transform:translateY(-2px) scale(1.01)}100%{transform:translateY(0) scale(1)}}
.crow.flying .wing-near,.crow.flying .wing-far{animation:flight-wing .22s ease-in-out infinite alternate}
@keyframes flight-wing{from{transform:rotate(-9deg)}to{transform:rotate(-56deg)}}
.crow.facing-left svg{transform:scaleX(-1)}
/* atmosphere */
.rain{position:absolute;z-index:10;inset:-18% -6% 0;opacity:0;pointer-events:none;background-image:repeating-linear-gradient(var(--rain-angle),transparent 0 17px,rgba(219,230,237,.38) 18px 19px,transparent 20px 35px),repeating-linear-gradient(var(--rain-angle),transparent 0 43px,rgba(219,230,237,.18) 44px 45px,transparent 46px 69px);background-size:100% 51px,100% 83px;animation:rain-fall var(--rain-speed) linear infinite;transition:opacity 2.4s}
.weather-rain .rain{opacity:.42}.weather-rain.heavy-rain .rain{opacity:.64}
@keyframes rain-fall{to{background-position:0 51px,0 83px}}
.rain-mist{position:absolute;z-index:9;left:-20%;right:-20%;bottom:7%;height:20%;opacity:0;background:linear-gradient(180deg,transparent,rgba(195,208,217,.12),transparent);filter:blur(10px);pointer-events:none;transition:opacity 3s}
.weather-rain .rain-mist{opacity:.7}
/* ── Timer panel ── */
.timer-area{position:relative;z-index:15;background:var(--panel);padding:clamp(25px,4vh,34px) clamp(20px,5.5vw,42px) 30px;text-align:center}
.time{font-size:clamp(49px,13vw,88px);font-weight:650;letter-spacing:.035em;font-variant-numeric:tabular-nums;line-height:1.14;white-space:nowrap}
.status{margin-top:10px;color:var(--muted);font-size:11px;letter-spacing:.28em;text-transform:uppercase}
.progress-wrap{margin-top:28px}
.track{height:8px;border-radius:20px;background:#3a4556;overflow:hidden}
.fill{height:100%;width:0%;border-radius:20px;background:linear-gradient(90deg,#aebccc,#e0e6ed);transition:width .45s linear}
.stats{display:flex;justify-content:space-between;gap:8px;margin-top:10px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.markers{display:flex;justify-content:space-between;margin:23px 0 0;color:var(--muted);font-size:12px}
.marker{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:34px}.dot{width:9px;height:9px;border-radius:50%;background:#465264;transition:background .35s,transform .35s}.marker.done .dot{background:#d2dbe5;transform:scale(1.25)}.marker.done span{color:#d5dde6}
.quote{min-height:100px;margin:27px 0 22px;padding:16px 18px;background:var(--panel-soft);border-left:3px solid #8996a9;text-align:left;color:#e0e6ee;line-height:1.9;font-size:15px;letter-spacing:.015em;display:flex;flex-direction:column;justify-content:center;gap:5px}
.quote small{display:block;color:#aeb9c8;font-size:13px;line-height:1.75}
.buttons{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.btn{min-height:54px;border:1.4px solid #697789;border-radius:16px;background:transparent;color:var(--ink);font-size:15px;font-weight:650;letter-spacing:.02em;cursor:pointer;transition:transform .12s,background .2s,border-color .2s;touch-action:manipulation}
.btn:active{transform:scale(.975)}.btn.primary{background:#cbd4e1;color:#192331;border-color:#cbd4e1}.btn:disabled{opacity:.38;cursor:default}
.footer{margin-top:21px;color:#778396;letter-spacing:.28em;font-size:10px}
/* Completion scene */
.done-overlay{position:fixed;inset:0;z-index:40;display:none;place-items:center;padding:26px;background:rgba(11,16,24,.82);backdrop-filter:blur(9px);text-align:center}
.done-overlay.show{display:grid}.done-card{width:min(440px,100%);padding:30px 22px;border:1px solid rgba(220,229,236,.19);border-radius:24px;background:#1a2230;box-shadow:0 24px 80px #0006}
.done-card h2{font-weight:500;font-size:clamp(28px,7vw,38px);letter-spacing:.12em;margin:0 0 15px}.done-card p{line-height:2;letter-spacing:.07em;color:#c8d0dc;margin:0}.done-card button{margin-top:22px;padding:13px 27px;border:1px solid #7b8797;border-radius:99px;background:#cbd4e1;color:#182230;font-weight:650}
@media(max-width:480px){.scene{height:clamp(300px,42svh,390px)}.timer-area{padding-left:20px;padding-right:20px}.quote{margin-top:25px}.btn{font-size:14px;min-height:52px}}
@media(max-height:700px){.scene{height:36svh;min-height:245px}.timer-area{padding-top:19px;padding-bottom:23px}.progress-wrap{margin-top:19px}.markers{margin-top:17px}.quote{margin-top:20px;margin-bottom:17px;padding:12px 15px;min-height:82px}.footer{margin-top:15px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<main class="app" aria-label="烏の棲む空、勉強タイマー">
  <section class="scene" id="scene" aria-label="カラスたちが暮らす空">
    <div class="moon" aria-hidden="true"></div>
    <div class="cloud one" aria-hidden="true"></div><div class="cloud two" aria-hidden="true"></div>
    <div class="haze" aria-hidden="true"></div><div class="light-shaft" aria-hidden="true"></div>
    <div class="wind-line a" aria-hidden="true"></div><div class="wind-line b" aria-hidden="true"></div>
    <header class="header"><div class="brand">烏 の 棲 む 空</div><div class="subtitle">120 MINUTES · FOCUS SESSION</div><div class="weather-label" id="weatherLabel">曇天 · 1羽</div></header>
    <div class="tree left" aria-hidden="true">
      <svg viewBox="0 0 150 300" preserveAspectRatio="xMidYMax meet">
        <path class="trunk" d="M74 298 Q72 205 75 82"/>
        <g class="bough"><path d="M75 85 Q52 65 22 49 M75 85 Q98 62 128 47 M75 120 Q42 103 9 91 M75 120 Q111 99 141 84 M74 158 Q39 145 8 136 M74 158 Q111 141 144 124 M74 200 Q41 187 17 180 M74 200 Q111 185 137 171"/><path d="M22 49l-13 -4m13 4 -3 -13m106 11 13 -3m-13 3 5 -13M9 91l-7 -7m7 7 -1 -13m133 6 7 -8m-7 8 1 -13M8 136l-7 -8m7 8 -2 -13m137 1 7 -7m-7 7 2 -13M17 180l-8 -7m8 7 -1 -12m121 3 8 -7m-8 7 2 -12"/></g>
        <g class="twig"><path d="M47 68l-18 -22m80 21 19 -20M38 111l-21 -22m93 21 22 -21M34 151l-20 -19m104 17 22 -19M43 192l-16 -15m89 13 17 -15"/></g>
      </svg>
    </div>
    <div class="tree right" aria-hidden="true">
      <svg viewBox="0 0 150 300" preserveAspectRatio="xMidYMax meet">
        <path class="trunk" d="M74 298 Q72 205 75 82"/>
        <g class="bough"><path d="M75 85 Q52 65 22 49 M75 85 Q98 62 128 47 M75 120 Q42 103 9 91 M75 120 Q111 99 141 84 M74 158 Q39 145 8 136 M74 158 Q111 141 144 124 M74 200 Q41 187 17 180 M74 200 Q111 185 137 171"/></g>
        <g class="twig"><path d="M22 49l-13 -4m13 4 -3 -13m106 11 13 -3m-13 3 5 -13M9 91l-7 -7m7 7 -1 -13m133 6 7 -8m-7 8 1 -13M8 136l-7 -8m7 8 -2 -13m137 1 7 -7m-7 7 2 -13M17 180l-8 -7m8 7 -1 -12m121 3 8 -7m-8 7 2 -12"/></g>
      </svg>
    </div>
    <div class="city" id="city" aria-hidden="true"></div>
    <div class="ground" aria-hidden="true"></div>
    <div class="wire-wrap" aria-hidden="true"><div class="wire"></div></div>
    <div id="crowField" aria-label="電線に止まるカラス"></div>
    <div class="rain-mist" aria-hidden="true"></div><div class="rain" aria-hidden="true"></div>
  </section>

  <section class="timer-area" aria-label="120分勉強タイマー">
    <div class="time" id="time" role="timer" aria-live="off">02:00:00</div>
    <div class="status" id="status">120 MINUTES · READY</div>
    <div class="progress-wrap">
      <div class="track" role="progressbar" aria-label="勉強の進捗" aria-valuemin="0" aria-valuemax="120" aria-valuenow="0" id="progressTrack"><div class="fill" id="fill"></div></div>
      <div class="stats"><span id="elapsed">経過 00:00</span><span id="percent">0%</span><span>目標 120分</span></div>
      <div class="markers">
        <div class="marker" data-min="30"><i class="dot"></i><span>30分</span></div>
        <div class="marker" data-min="60"><i class="dot"></i><span>60分</span></div>
        <div class="marker" data-min="90"><i class="dot"></i><span>90分</span></div>
        <div class="marker" data-min="120"><i class="dot"></i><span>120分</span></div>
      </div>
    </div>
    <div class="quote" id="quote"><span id="quoteMain">「静かに、確実に。今日の自分を積み上げる。」</span><small id="quoteSub">電線のカラスは、君が始めるのを待っている。</small></div>
    <div class="buttons">
      <button class="btn primary" id="start" type="button">勉強開始</button>
      <button class="btn" id="pause" type="button" disabled>一時停止</button>
      <button class="btn" id="reset" type="button">リセット</button>
    </div>
    <div class="footer">PHONE DOWN · FOCUS UP</div>
  </section>
</main>

<div class="done-overlay" id="doneOverlay" role="dialog" aria-modal="true" aria-labelledby="doneTitle">
  <div class="done-card"><h2 id="doneTitle">120分、完遂。</h2><p>空が晴れた。<br>今日の自分との約束を、守ったね。<br>静かに積み上げたものは、消えない。</p><button id="closeDone" type="button">空に戻る</button></div>
</div>

<script>
(() => {
  'use strict';
  const TOTAL_SECONDS = 120 * 60;
  const MAX_CROWS = 4;
  const PERCH_SLOTS = [0.14, 0.37, 0.63, 0.86];
  const $ = (id) => document.getElementById(id);
  const scene = $('scene');
  const field = $('crowField');
  const timeEl = $('time');
  const statusEl = $('status');
  const fillEl = $('fill');
  const elapsedEl = $('elapsed');
  const percentEl = $('percent');
  const progressTrack = $('progressTrack');
  const startBtn = $('start');
  const pauseBtn = $('pause');
  const resetBtn = $('reset');
  const doneOverlay = $('doneOverlay');
  const weatherLabel = $('weatherLabel');
  const quoteMain = $('quoteMain');
  const quoteSub = $('quoteSub');

  const milestoneMessages = [
    { at: 0, main: '「静かに、確実に。今日の自分を積み上げる。」', sub: '電線のカラスは、君が始めるのを待っている。' },
    { at: 30, main: '「誰も見ていなくても、決めたことを守る。」', sub: '小さな一貫が、明日の自分をつくる。' },
    { at: 60, main: '「焦らなくていい。止まらなければいい。」', sub: 'ひとつずつ、目の前のことを。' },
    { at: 90, main: '「自由は、自分との約束を守ることから始まる。」', sub: '羽を休めてもいい。飛ぶことを忘れなければ。' },
    { at: 120, main: '「120分、完遂。」', sub: '静かに積み上げたものは、消えない。' }
  ];

  let remaining = TOTAL_SECONDS;
  let endAt = null;
  let timerInterval = null;
  let timerStarted = false;
  let completed = false;
  let weather = 'cloudy';
  let weatherTimeout = null;
  let arrivalTimeout = null;
  let windTimeout = null;
  let windStrength = 0.35;
  let crowId = 0;
  const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const random = (min, max) => min + Math.random() * (max - min);
  const choose = (items) => items[Math.floor(Math.random() * items.length)];
  const clamp = (n, min, max) => Math.max(min, Math.min(max, n));

  // A small, quiet city silhouette. Window glow is deliberately restrained.
  const heights = [30, 46, 36, 62, 27, 50, 39, 69, 33, 54, 42, 64, 29, 47, 35, 57];
  $('city').innerHTML = heights.map((h, i) => `<div class="building" style="--h:${h}%;--lit:${i % 3 === 0 ? .34 : .13}"></div>`).join('');

  // The bird is a custom layered SVG: body, tail feathers, two wings, head, beak, eye, legs and gripping claws.
  function crowSvg() {
    return `<svg class="crow-svg" viewBox="0 0 132 86" role="img" aria-label="電線に止まるカラス">
      <g class="tail-group">
        <path class="tail" d="M34 48 Q21 47 7 61 Q23 60 42 55Z"/>
        <path class="tail" d="M37 49 Q25 54 16 66 Q32 62 45 56Z"/>
        <path class="tail" d="M40 49 Q34 57 31 67 Q43 61 49 54Z"/>
      </g>
      <path class="body-shadow" d="M25 48 C25 35 39 27 56 27 C74 25 88 34 91 45 C90 56 77 63 58 64 C42 64 30 58 25 48Z"/>
      <path class="body" d="M24 47 C29 36 42 30 57 30 C73 29 87 37 89 47 C84 57 70 61 56 61 C42 60 30 56 24 47Z"/>
      <path class="wing-far" d="M38 42 C44 27 58 23 72 33 C68 40 57 47 45 51Z"/>
      <path class="wing-feather" d="M39 43 C47 34 57 31 68 37 C61 45 52 49 43 52Z"/>
      <path class="wing-near" d="M33 45 C40 30 58 27 74 38 C68 48 52 56 39 55 C34 52 32 49 33 45Z"/>
      <path class="wing-highlight" d="M42 43 Q55 33 67 40 Q57 49 44 51Z"/>
      <path class="neck" d="M72 39 C72 29 74 20 82 17 C88 14 98 20 99 29 C99 38 91 45 83 46Z"/>
      <g class="head-group">
        <path class="head" d="M77 29 C77 18 85 11 95 12 C105 13 111 21 108 30 C106 39 97 43 88 39 C81 37 77 34 77 29Z"/>
        <path class="beak" d="M105 25 C113 25 122 28 131 30 C123 33 115 35 105 34 C108 31 108 28 105 25Z"/>
        <circle class="eye" cx="99" cy="22" r="2.5"/><circle class="eye-glint" cx="99.8" cy="21.3" r=".75"/>
      </g>
      <path class="legs" d="M56 59 L55 75 M74 59 L76 75"/>
      <path class="claws" d="M55 74 Q50 76 49 80 M55 75 Q57 79 62 79 M76 74 Q71 77 71 80 M76 75 Q79 79 84 78"/>
      <path class="puff" d="M25 45 Q18 38 23 32 M33 57 Q25 63 28 69 M77 57 Q85 64 82 69 M88 43 Q96 39 94 34"/>
    </svg>`;
  }

  function perchY() {
    // Measure the rendered wire itself, instead of estimating its position.
    // This keeps every resident/newcomer aligned even when mobile viewport heights change.
    const wire = scene.querySelector('.wire');
    const sceneRect = scene.getBoundingClientRect();
    const wireRect = wire ? wire.getBoundingClientRect() : null;
    const wireCenterY = wireRect
      ? wireRect.top + wireRect.height / 2 - sceneRect.top
      : scene.clientHeight * 0.57 + 8;
    // Crow SVG claws end at y=80 in an 86-unit viewBox, stretched to 64px high.
    const footOffset = 64 * (80 / 86);
    return Math.round(wireCenterY - footOffset);
  }

  function crowWidth() {
    return clamp(scene.clientWidth * 0.23, 78, 96);
  }

  function positionCrow(crow) {
    if (!crow.isConnected) return;
    const slot = Number(crow.dataset.slot);
    const width = crowWidth();
    const x = scene.clientWidth * PERCH_SLOTS[slot];
    crow.style.width = `${width}px`;
    crow.style.height = '64px';
    crow.style.left = `${Math.round(x)}px`;
    crow.style.top = `${perchY()}px`;
  }

  function makeCrow(slot, { newcomer = false, fromSide = 'left' } = {}) {
    const crow = document.createElement('div');
    crow.className = 'crow idle';
    crow.dataset.id = String(++crowId);
    crow.dataset.slot = String(slot);
    crow.innerHTML = crowSvg();
    if (fromSide === 'right') crow.classList.add('facing-left');
    positionCrow(crow);
    field.appendChild(crow);

    if (newcomer) {
      crow.classList.remove('idle');
      crow.classList.add('flying');
      const targetX = scene.clientWidth * PERCH_SLOTS[slot];
      const targetY = perchY();
      const startX = fromSide === 'left' ? -crowWidth() * 0.75 : scene.clientWidth + crowWidth() * 0.75;
      const startY = scene.clientHeight * random(0.12, 0.27);
      const duration = reducedMotion ? 0 : random(3600, 4700);
      // Set the destination first. The landing handler re-measures the real wire,
      // so interrupted/mobile-throttled animations cannot leave a bird floating.
      crow.style.left = `${Math.round(targetX)}px`;
      crow.style.top = `${Math.round(targetY)}px`;
      let landed = false;
      let flight = null;
      const finishLanding = () => {
        if (landed || !crow.isConnected) return;
        landed = true;
        if (flight) { try { flight.cancel(); } catch (_) {} }
        positionCrow(crow);
        crow.classList.remove('flying');
        crow.classList.add('idle', 'action-land');
        crow.style.transform = 'translateX(-50%)';
        setTimeout(() => { if (crow.isConnected) crow.classList.remove('action-land'); }, 850);
        const companions = [...field.querySelectorAll('.crow:not(.flying)')].filter(item => item !== crow);
        if (companions.length) setTimeout(() => runCrowAction(choose(companions), 'tilt'), random(250, 750));
        scheduleCrowBehavior(crow);
      };
      if (!reducedMotion && typeof crow.animate === 'function') {
        flight = crow.animate([
          { left: `${Math.round(startX)}px`, top: `${Math.round(startY)}px`, transform: 'translateX(-50%) scale(.30) rotate(-10deg)', opacity: .12, offset: 0 },
          { left: `${Math.round(startX + (targetX - startX) * .46)}px`, top: `${Math.round(startY + (targetY - startY) * .38)}px`, transform: 'translateX(-50%) scale(.52) rotate(5deg)', opacity: .55, offset: .38 },
          { left: `${Math.round(startX + (targetX - startX) * .82)}px`, top: `${Math.round(targetY - 24)}px`, transform: 'translateX(-50%) scale(1.03) rotate(-3deg)', opacity: 1, offset: .78 },
          { left: `${Math.round(targetX)}px`, top: `${Math.round(targetY)}px`, transform: 'translateX(-50%) scale(.97) rotate(1deg)', opacity: 1, offset: .92 },
          { left: `${Math.round(targetX)}px`, top: `${Math.round(targetY)}px`, transform: 'translateX(-50%) scale(1) rotate(0deg)', opacity: 1, offset: 1 }
        ], { duration, easing: 'cubic-bezier(.18,.62,.22,1)', fill: 'forwards' });
        flight.finished.then(finishLanding).catch(() => {});
        // A backup landing is important on mobile: browser tab changes can pause
        // or cancel Web Animations without resolving the normal completion path.
        setTimeout(finishLanding, duration + 450);
      } else {
        finishLanding();
      }
    } else {
      scheduleCrowBehavior(crow, random(9000, 18000));
    }
    updateCrowCount();
    return crow;
  }

  function updateCrowCount() {
    const count = field.querySelectorAll('.crow').length;
    const names = { cloudy: '曇天', rain: '雨', fog: '霧', clearing: '雲の切れ間' };
    weatherLabel.textContent = `${names[weather]} · ${count}羽`;
  }

  function runCrowAction(crow, action) {
    if (!crow || !crow.isConnected || crow.classList.contains('flying') || crow.dataset.busy === '1') return;
    const durations = { tilt: 1250, preen: 1650, stretch: 1850, flap: 1050, hop: 780, rain: 1900, puff: 1150 };
    const classes = { tilt: 'action-tilt', preen: 'action-preen', stretch: 'action-stretch', flap: 'action-flap', hop: 'action-hop', rain: 'action-rain', puff: 'action-puff' };
    const actionClass = classes[action];
    if (!actionClass) return;
    crow.dataset.busy = '1';
    crow.classList.add(actionClass);
    setTimeout(() => {
      if (crow.isConnected) {
        crow.classList.remove(actionClass);
        delete crow.dataset.busy;
      }
    }, durations[action]);
  }

  function scheduleCrowBehavior(crow, delay = random(17000, 36000)) {
    if (!crow.isConnected) return;
    clearTimeout(crow._behaviorTimer);
    crow._behaviorTimer = setTimeout(() => {
      if (!crow.isConnected) return;
      if (crow.dataset.busy !== '1' && !crow.classList.contains('flying')) {
        let action;
        if (weather === 'rain' && scene.classList.contains('heavy-rain')) {
          action = choose(['rain', 'rain', 'puff', 'puff', 'tilt']);
        } else if (weather === 'rain') {
          action = choose(['rain', 'rain', 'preen', 'puff', 'tilt']);
        } else {
          action = choose(['preen', 'tilt', 'stretch', 'flap', 'hop', 'puff', 'preen']);
        }
        runCrowAction(crow, action);
      }
      const heavy = weather === 'rain' && scene.classList.contains('heavy-rain');
      scheduleCrowBehavior(crow, random(heavy ? 25000 : weather === 'rain' ? 17000 : 19000, heavy ? 43000 : weather === 'rain' ? 35000 : 42000));
    }, delay);
  }

  function triggerRainReactions() {
    const crows = [...field.querySelectorAll('.crow:not(.flying)')];
    crows.forEach((crow, index) => {
      setTimeout(() => {
        if (!crow.isConnected || weather !== 'rain') return;
        runCrowAction(crow, Math.random() < .72 ? 'rain' : 'puff');
      }, random(2400, 9500) + index * random(500, 1300));
    });
  }

  function freeSlots() {
    const occupied = new Set([...field.querySelectorAll('.crow')].map(c => Number(c.dataset.slot)));
    return PERCH_SLOTS.map((_, index) => index).filter(index => !occupied.has(index));
  }

  function scheduleArrival(delay = random(55000, 128000)) {
    clearTimeout(arrivalTimeout);
    arrivalTimeout = setTimeout(() => {
      const count = field.querySelectorAll('.crow').length;
      const slots = freeSlots();
      // A new neighbor is occasional, never guaranteed on a fixed schedule.
      if (count < MAX_CROWS && slots.length && Math.random() < .72) {
        const slot = choose(slots);
        makeCrow(slot, { newcomer: true, fromSide: Math.random() < .5 ? 'left' : 'right' });
      }
      scheduleArrival(random(58000, 142000));
    }, delay);
  }

  function setWeather(next) {
    if (weather === next) return;
    weather = next;
    scene.classList.remove('weather-cloudy', 'weather-rain', 'weather-fog', 'weather-clearing', 'heavy-rain');
    scene.classList.add(`weather-${next}`);
    if (next === 'rain' && Math.random() < .28) scene.classList.add('heavy-rain');
    if (next === 'rain') triggerRainReactions();
    updateCrowCount();
    setWindForWeather();
  }

  function chooseNextWeather() {
    const options = {
      cloudy: [['rain', 0.39], ['fog', 0.18], ['clearing', 0.43]],
      rain: [['cloudy', 0.58], ['fog', 0.22], ['clearing', 0.20]],
      fog: [['cloudy', 0.46], ['rain', 0.18], ['clearing', 0.36]],
      clearing: [['cloudy', 0.62], ['rain', 0.22], ['fog', 0.16]]
    }[weather] || [['cloudy', 1]];
    let roll = Math.random();
    for (const [name, weight] of options) { roll -= weight; if (roll <= 0) return name; }
    return options[options.length - 1][0];
  }

  function scheduleWeather(delay = random(42000, 92000)) {
    clearTimeout(weatherTimeout);
    weatherTimeout = setTimeout(() => {
      setWeather(chooseNextWeather());
      const duration = weather === 'rain' ? random(26000, 46000) : weather === 'fog' ? random(30000, 57000) : random(39000, 84000);
      scheduleWeather(duration);
    }, delay);
  }

  function setWindForWeather() {
    windStrength = weather === 'rain' ? random(.62, 1) : weather === 'fog' ? random(.16, .48) : random(.22, .72);
    const turn = (0.35 + windStrength * 1.35);
    scene.style.setProperty('--wind-a', `${(-turn * .55).toFixed(2)}deg`);
    scene.style.setProperty('--wind-b', `${turn.toFixed(2)}deg`);
    scene.style.setProperty('--tree-speed', `${(8.5 - windStrength * 3.7).toFixed(1)}s`);
    scene.style.setProperty('--cloud-speed', `${Math.round(94 - windStrength * 42)}s`);
    scene.style.setProperty('--rain-angle', `${103 + windStrength * 13}deg`);
    scene.style.setProperty('--rain-speed', `${(.72 - windStrength * .38).toFixed(2)}s`);
    scene.style.setProperty('--wire-lean', `${(windStrength * .08).toFixed(2)}deg`);
  }

  function scheduleWind() {
    clearTimeout(windTimeout);
    windTimeout = setTimeout(() => {
      // Wind keeps changing gently even in rain, so the rain slant, clouds, trees and wire stay connected.
      setWindForWeather();
      scheduleWind();
    }, random(17000, 34000));
  }

  function formatTime(seconds) {
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = seconds % 60;
    return [h, m, s].map(n => String(n).padStart(2, '0')).join(':');
  }

  function renderTimer() {
    const elapsed = TOTAL_SECONDS - remaining;
    const elapsedMinutes = Math.floor(elapsed / 60);
    const percent = Math.floor((elapsed / TOTAL_SECONDS) * 100);
    timeEl.textContent = formatTime(remaining);
    fillEl.style.width = `${percent}%`;
    elapsedEl.textContent = `経過 ${String(Math.floor(elapsed / 60)).padStart(2, '0')}:${String(elapsed % 60).padStart(2, '0')}`;
    percentEl.textContent = `${percent}%`;
    progressTrack.setAttribute('aria-valuenow', String(Math.floor(elapsed / 60)));
    document.querySelectorAll('.marker').forEach(marker => marker.classList.toggle('done', elapsedMinutes >= Number(marker.dataset.min)));
    const message = [...milestoneMessages].reverse().find(item => elapsedMinutes >= item.at) || milestoneMessages[0];
    quoteMain.textContent = message.main;
    quoteSub.textContent = message.sub;
    scene.classList.toggle('deep-session', elapsed >= 90 * 60);
  }

  function updateStatus() {
    if (completed) statusEl.textContent = 'SESSION COMPLETE';
    else if (!timerStarted) statusEl.textContent = '120 MINUTES · READY';
    else if (timerInterval === null) statusEl.textContent = 'PAUSED · TAKE YOUR TIME';
    else statusEl.textContent = 'FOCUS IN PROGRESS';
    startBtn.textContent = completed ? '完了' : (timerInterval !== null ? '勉強中' : (timerStarted ? '再開' : '勉強開始'));
    startBtn.disabled = completed || timerInterval !== null;
    pauseBtn.textContent = '一時停止';
    pauseBtn.disabled = !timerStarted || timerInterval === null || completed;
  }

  function timerTick() {
    if (endAt === null || completed) return;
    remaining = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
    renderTimer();
    if (remaining <= 0) finishSession();
  }

  function startTimer() {
    if (completed || timerInterval !== null) return;
    timerStarted = true;
    endAt = Date.now() + remaining * 1000;
    timerInterval = window.setInterval(timerTick, 250);
    updateStatus();
    timerTick();
  }

  function pauseTimer() {
    if (timerInterval === null || completed) return;
    timerTick();
    if (completed) return;
    clearInterval(timerInterval);
    timerInterval = null;
    endAt = null;
    updateStatus();
  }

  function finishSession() {
    if (completed) return;
    remaining = 0;
    completed = true;
    clearInterval(timerInterval);
    timerInterval = null;
    endAt = null;
    renderTimer();
    updateStatus();
    quoteMain.textContent = '「120分、完遂。」';
    quoteSub.textContent = '今日の自分との約束を、守ったね。静かに積み上げたものは、消えない。';
    clearTimeout(weatherTimeout);
    clearTimeout(arrivalTimeout);
    weatherTimeout = arrivalTimeout = null;
    setWeather('clearing');
    [...field.querySelectorAll('.crow:not(.flying)')].forEach((crow, index) => setTimeout(() => runCrowAction(crow, 'flap'), index * 360));
    doneOverlay.classList.add('show');
  }

  function resetTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
    endAt = null;
    remaining = TOTAL_SECONDS;
    timerStarted = false;
    completed = false;
    doneOverlay.classList.remove('show');
    renderTimer();
    updateStatus();
  }

  function updateDayTone() {
    // Keep the palette dark, with only a subtle shift as real local time moves into late night.
    const hour = new Date().getHours();
    scene.classList.toggle('late-night-clock', hour >= 21 || hour < 5);
  }

  startBtn.addEventListener('click', startTimer);
  pauseBtn.addEventListener('click', pauseTimer);
  resetBtn.addEventListener('click', resetTimer);
  $('closeDone').addEventListener('click', () => doneOverlay.classList.remove('show'));
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      if (timerInterval !== null) timerTick();
      // Re-align birds after Safari resumes and may have throttled an arrival animation.
      field.querySelectorAll('.crow.flying').forEach(crow => {
        const animations = crow.getAnimations();
        animations.forEach(animation => { try { animation.finish(); } catch (_) {} });
      });
      field.querySelectorAll('.crow:not(.flying)').forEach(positionCrow);
    }
  });
  window.addEventListener('resize', () => {
    field.querySelectorAll('.crow:not(.flying)').forEach(positionCrow);
    field.querySelectorAll('.crow.flying').forEach(crow => {
      const animations = crow.getAnimations();
      animations.forEach(animation => { try { animation.finish(); } catch (_) {} });
    });
  });

  // One quiet resident at the beginning. The rest may wander in much later.
  makeCrow(1);
  updateCrowCount();
  renderTimer();
  updateStatus();
  updateDayTone();
  window.setInterval(updateDayTone, 60000);
  setWeather('cloudy');
  scheduleWeather(random(35000, 78000));
  scheduleArrival(random(56000, 118000));
  scheduleWind();
})();
</script>
</body>
</html>
