<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151a25"><title>烏の棲む空 — Living Sky</title>
<style>
:root{--bg:#151a25;--panel:#1c2330;--ink:#e7eaf1;--muted:#8c96a8;--line:#3c4657;--accent:#cbd3df;--sky1:#667486;--sky2:#303c4b;--sky3:#1e2936}
*{box-sizing:border-box}body{margin:0;background:#0e121b;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center;padding:16px 12px 24px}
.app{width:min(760px,100%);border-radius:28px;overflow:hidden;background:var(--bg);box-shadow:0 20px 70px #0005}
.scene{height:clamp(250px,43vh,390px);position:relative;overflow:hidden;background:linear-gradient(180deg,var(--sky1),var(--sky2) 66%,var(--sky3));transition:background 2s ease}
.scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0c14202c,transparent 55%,#0b1018aa);pointer-events:none}
.header{position:absolute;z-index:3;left:24px;top:20px}.brand{font-weight:700;letter-spacing:.24em;font-size:17px}.sub{margin-top:8px;font-size:10px;letter-spacing:.28em;color:#d0d6dfb8}
.moon{position:absolute;right:14%;top:22%;width:62px;height:62px;border-radius:50%;background:#c8ced3a0;box-shadow:0 0 32px #d9e1eb22;transition:opacity 1.5s}
.cloud{position:absolute;background:#b4bdc8;opacity:.13;border-radius:70px;filter:blur(5px);height:38px;width:150px;animation:cloudMove 55s linear infinite}.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%;bottom:8px}.cloud:before{width:70px;height:65px;left:25px}.cloud:after{width:85px;height:76px;left:70px}.c1{top:25%;left:-170px}.c2{top:42%;left:-280px;animation-duration:80s;transform:scale(1.35)}@keyframes cloudMove{to{transform:translateX(1100px)}}
.wire{position:absolute;z-index:2;top:61%;left:-3%;width:106%;height:2px;background:#17202b;box-shadow:0 2px 0 #a7b0bb55;transform:rotate(-.6deg)}
.tree{position:absolute;bottom:12%;width:0;height:0;border-left:clamp(38px,7vw,62px) solid transparent;border-right:clamp(38px,7vw,62px) solid transparent;border-bottom:clamp(130px,23vw,220px) solid #202b38;transform-origin:bottom;animation:sway 5s ease-in-out infinite}.tree:before{content:"";position:absolute;left:-27px;top:70px;border-left:27px solid transparent;border-right:27px solid transparent;border-bottom:75px solid #202b38}.tree:after{content:"";position:absolute;left:-4px;top:160px;width:8px;height:60px;background:#202b38}.tree.left{left:7%;animation-duration:6.5s}.tree.right{right:7%;transform:scale(.72);animation-duration:7s}@keyframes sway{0%,100%{rotate:-1deg}50%{rotate:1.4deg}}
.city{position:absolute;bottom:12%;left:0;width:100%;height:24%;display:flex;align-items:end;gap:4%;opacity:.65}.building{background:#263341;flex:1;height:var(--h);position:relative}.building:before{content:"";position:absolute;inset:10px 8px;background:repeating-linear-gradient(0deg,transparent 0 17px,#7d899422 18px 20px)}
.ground{position:absolute;bottom:0;height:13%;width:100%;background:linear-gradient(#303b49,#1b2430);box-shadow:0 -9px 25px #cbd5e010}
.bird{position:absolute;z-index:4;top:calc(61% - 38px);left:var(--x,35%);width:84px;height:52px;animation:birdIdle 4s ease-in-out infinite;transition:left 2s ease,top 2s ease;filter:drop-shadow(0 3px 2px #0003)}
.bird svg{width:100%;height:100%;overflow:visible}.bird .wing{transform-origin:32px 27px;animation:wingIdle 5s ease-in-out infinite}.bird .tail{transform-origin:18px 31px}.bird .eye{fill:#d5dce7}.bird .body{fill:#0d121b}.bird .feather{fill:#202b3b}.bird .beak{fill:#101721}.bird .legs{stroke:#101721;stroke-width:3;stroke-linecap:round;fill:none}
@keyframes birdIdle{0%,100%{translate:0 0}50%{translate:0 -1px}}@keyframes wingIdle{0%,95%,100%{rotate:0}97%{rotate:-12deg}98%{rotate:6deg}}
.bird.preen .wing{animation:preen 1.6s ease-in-out 2}.bird.preen{translate:0 0}@keyframes preen{0%,100%{rotate:0}35%{rotate:35deg}65%{rotate:10deg}}
.bird.shake{animation:shake .7s ease-in-out 2}@keyframes shake{0%,100%{rotate:0}25%{rotate:-8deg;translate:-2px 0}50%{rotate:8deg;translate:2px 0}75%{rotate:-4deg}}
.bird.flap .wing{animation:flap .42s ease-in-out 5}@keyframes flap{0%,100%{rotate:0}50%{rotate:-60deg}}
.bird.stretch .wing{animation:stretch .9s ease-in-out 2}@keyframes stretch{0%,100%{rotate:0}50%{rotate:-45deg}}
.bird.flyin{animation:flyin 3s ease-out forwards}@keyframes flyin{0%{left:110%;top:25%;rotate:-8deg}65%{top:55%;rotate:4deg}100%{top:calc(61% - 38px);rotate:0}}
.rain{position:absolute;z-index:5;inset:-30% 0 0;pointer-events:none;opacity:0;background-image:repeating-linear-gradient(105deg,transparent 0 17px,#dce7f066 18px 19px,transparent 20px 35px);background-size:100% 45px;animation:rainfall .42s linear infinite;transition:opacity 1s}.scene.raining .rain{opacity:.5}@keyframes rainfall{to{background-position:0 45px}}
.fog{position:absolute;z-index:2;inset:25% -30%;opacity:0;pointer-events:none;background:linear-gradient(90deg,transparent,#c6ced42a,#d0d8df20,transparent);filter:blur(18px);animation:fogDrift 24s linear infinite;transition:opacity 2s}.scene.foggy .fog{opacity:.8}@keyframes fogDrift{to{translate:50% 0}}
.light{position:absolute;inset:0;background:radial-gradient(ellipse at 65% 30%,#dce4ef20,transparent 40%);opacity:.5;transition:opacity 2s}.scene.clear .light{opacity:1}
.timerArea{padding:28px 26px 30px;text-align:center}.time{font-size:clamp(48px,12vw,86px);font-weight:650;letter-spacing:.045em;font-variant-numeric:tabular-nums;line-height:1.15}.status{margin-top:10px;color:var(--muted);font-size:12px;letter-spacing:.3em;text-transform:uppercase}
.progressWrap{margin-top:28px}.progress{height:8px;border-radius:20px;background:#3a4352;position:relative;overflow:visible}.progressFill{height:100%;width:0;background:linear-gradient(90deg,#aeb9c9,#dbe2eb);border-radius:20px;transition:width .4s linear}.markers{display:flex;justify-content:space-between;margin:12px 0 0;color:var(--muted);font-size:12px}.marker{display:flex;flex-direction:column;align-items:center;gap:7px}.dot{width:9px;height:9px;border-radius:50%;background:#465163;transition:background .3s,scale .3s}.marker.done .dot{background:#c5cfdd;scale:1.25}
.quote{margin:28px 0 22px;padding:17px 18px;background:#202633;border-left:3px solid #8d98aa;text-align:left;color:#dfe4ec;line-height:1.9;font-size:15px;min-height:92px}.quote small{display:block;color:#aab4c3;margin-top:6px;font-size:13px}
.buttons{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.btn{min-height:54px;border:1px solid #6c7788;border-radius:15px;background:transparent;color:var(--ink);font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s,background .2s}.btn:active{transform:scale(.97)}.btn.primary{background:#cbd4e0;color:#1b2330;border-color:#cbd4e0}.foot{margin-top:22px;color:#778294;letter-spacing:.28em;font-size:10px}
@media(max-width:480px){body{padding:0}.app{border-radius:0;min-height:100vh}.scene{height:38vh;min-height:245px}.timerArea{padding:26px 20px 34px}.quote{margin-top:23px}.bird{transform:scale(.84);transform-origin:center}.tree.left{left:3%}.tree.right{right:3%}}
</style></head>
<body><main class="app">
<section class="scene" id="scene"><div class="header"><div class="brand">烏 の 棲 む 空</div><div class="sub">120 MINUTES · FOCUS SESSION</div></div><div class="moon"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="light"></div><div class="fog"></div><div class="tree left"></div><div class="tree right"></div><div class="city" id="city"></div><div class="wire"></div><div class="birds" id="birds"></div><div class="rain"></div><div class="ground"></div></section>
<section class="timerArea"><div class="time" id="time">02:00:00</div><div class="status" id="status">120 MINUTES · READY</div><div class="progressWrap"><div class="progress"><div class="progressFill" id="fill"></div></div><div class="markers"><div class="marker" data-min="30"><i class="dot"></i><span>30分</span></div><div class="marker" data-min="60"><i class="dot"></i><span>60分</span></div><div class="marker" data-min="90"><i class="dot"></i><span>90分</span></div><div class="marker" data-min="120"><i class="dot"></i><span>120分</span></div></div></div>
<div class="quote" id="quote">「静かに、確実に。今日の自分を積み上げる。」<small>電線のカラスは、君が始めるのを待っている。</small></div><div class="buttons"><button class="btn primary" id="start">勉強開始</button><button class="btn" id="pause">一時停止</button><button class="btn" id="reset">リセット</button></div><div class="foot">PHONE DOWN · FOCUS UP</div></section></main>
<script>
(()=>{
const TOTAL=7200;let remaining=TOTAL,started=false,paused=true,done=false,last=Date.now(),ticker=null,weather='cloudy',weatherTimer=null,behaviorTimer=null,arrivalTimer=null;
const $=id=>document.getElementById(id),scene=$('scene'),birds=$('birds');
const messages=[['静かに、確実に。今日の自分を積み上げる。','電線のカラスは、君が始めるのを待っている。'],['誰も見ていなくても、決めたことを守る。','小さな一貫が、明日の自分をつくる。'],['焦らなくていい。止まらなければいい。','ひとつずつ、目の前のことを。'],['未来は、大きな決意より小さな一貫から。','羽を休めてもいい。飛ぶことを忘れなければ。'],['自由は、自分との約束を守ることから始まる。','ここまで積み上げた時間は、ちゃんと君のもの。'],['今やるべきことに、今の自分を使う。','静かな努力にも、確かな力がある。']];
const cityHeights=[25,38,18,52,30,68,20,44,35,60,24,42,32,55,22];$('city').innerHTML=cityHeights.map(h=>`<div class="building" style="--h:${h}%"></div>`).join('');
function birdHTML(){return `<svg viewBox="0 0 90 55" aria-hidden="true"><path class="tail" d="M22 31 L4 39 Q18 42 31 38 Z"/><path class="body" d="M19 33 Q27 19 43 19 Q58 16 66 29 Q63 39 47 42 Q31 43 19 33Z"/><path class="feather" d="M23 33 Q36 21 48 28 Q43 36 34 39Z"/><path class="wing" d="M31 27 Q43 10 56 23 Q47 30 36 34Z"/><path class="beak" d="M62 25 L87 30 L64 33Z"/><circle class="eye" cx="58" cy="25" r="2.2"/><path class="legs" d="M43 40 L41 49 M52 40 L54 49 M38 49 L44 49 M51 49 L57 49"/></svg>`}
function makeBird(x,extra=''){const el=document.createElement('div');el.className='bird '+extra;el.style.setProperty('--x',x);el.innerHTML=birdHTML();birds.appendChild(el);return el}
let bird1=makeBird('34%');
function random(min,max){return Math.random()*(max-min)+min}
function setWeather(w){weather=w;scene.classList.remove('raining','foggy','clear');if(w==='rain')scene.classList.add('raining');if(w==='fog')scene.classList.add('foggy');if(w==='clear')scene.classList.add('clear')}
function cycleWeather(){const choices=['cloudy','rain','fog','clear'];let next=choices[Math.floor(Math.random()*choices.length)];if(next===weather)next=choices[(choices.indexOf(next)+1)%choices.length];setWeather(next);weatherTimer=setTimeout(cycleWeather,random(45000,100000));}
function doBehavior(){if(done)return;const all=[...birds.children];if(all.length){const b=all[Math.floor(Math.random()*all.length)];const action=['preen','shake','flap','stretch'][Math.floor(Math.random()*4)];b.classList.remove('preen','shake','flap','stretch');void b.offsetWidth;b.classList.add(action);setTimeout(()=>b.classList.remove(action),action==='flap'?2300:action==='preen'?3500:1800)}behaviorTimer=setTimeout(doBehavior,random(12000,30000));}
function arrival(){if(done)return;if(birds.children.length<4&&Math.random()<.78){let b=makeBird('110%','flyin');setTimeout(()=>b.style.left=(24+birds.children.length*16+random(-3,3))+'%',3200);setTimeout(()=>b.classList.remove('flyin'),3300)}arrivalTimer=setTimeout(arrival,random(55000,140000));}
function update(){let elapsed=TOTAL-remaining,mins=Math.floor(elapsed/60),pct=Math.floor(elapsed/TOTAL*100);$('time').textContent=`${String(Math.floor(remaining/3600)).padStart(2,'0')}:${String(Math.floor(remaining%3600/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}`;$('fill').style.width=pct+'%';document.querySelectorAll('.marker').forEach(m=>m.classList.toggle('done',mins>=+m.dataset.min));$('status').textContent=done?'SESSION COMPLETE':paused?(started?'PAUSED':'120 MINUTES · READY'):'FOCUS IN PROGRESS';let index=Math.min(5,Math.floor(mins/20));$('quote').innerHTML=`「${messages[index][0]}」<small>${messages[index][1]}</small>`;}
function tick(){const now=Date.now(),delta=Math.floor((now-last)/1000);if(delta>0){remaining=Math.max(0,remaining-delta);last=now;update();if(remaining===0)finish()}}
function start(){if(done)return;started=true;paused=false;last=Date.now();$('start').textContent='再開';$('status').textContent='FOCUS IN PROGRESS';if(!ticker)ticker=setInterval(tick,500);if(!weatherTimer)weatherTimer=setTimeout(cycleWeather,random(20000,50000));if(!behaviorTimer)behaviorTimer=setTimeout(doBehavior,random(8000,18000));if(!arrivalTimer)arrivalTimer=setTimeout(arrival,random(35000,90000));}
function pause(){if(!started||done)return;tick();paused=true;clearInterval(ticker);ticker=null;clearTimeout(weatherTimer);clearTimeout(behaviorTimer);clearTimeout(arrivalTimer);weatherTimer=behaviorTimer=arrivalTimer=null;update()}
function finish(){done=true;paused=true;clearInterval(ticker);ticker=null;setWeather('clear');[...birds.children].forEach(b=>{b.classList.add('flap');setTimeout(()=>b.classList.remove('flap'),2500)});$('status').textContent='SESSION COMPLETE';$('quote').innerHTML='「120分、完遂。」<small>今日の自分との約束を、守ったね。静かに積み上げたものは、消えない。</small>';}
function reset(){clearInterval(ticker);ticker=null;clearTimeout(weatherTimer);clearTimeout(behaviorTimer);clearTimeout(arrivalTimer);weatherTimer=behaviorTimer=arrivalTimer=null;remaining=TOTAL;started=false;paused=true;done=false;setWeather('cloudy');birds.innerHTML='';bird1=makeBird('34%');$('start').textContent='勉強開始';update()}
$('start').addEventListener('click',start);$('pause').addEventListener('click',pause);$('reset').addEventListener('click',reset);update();
})();
</script></body></html>
